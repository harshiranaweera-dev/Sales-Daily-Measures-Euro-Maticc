<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euro Maticc – Daily Measures</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--bd:#d9dde3;--ac:#0095d5;--on:#fff;--ok:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mu:#9aa1ab;--bd:#343a42;--ac:#29b9f5;--on:#00131c;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--tx:#eceef1;--mu:#9aa1ab;--bd:#343a42;--ac:#29b9f5;--on:#00131c;--ok:#4ade80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#000;color:#fff;padding:10px 18px;border-bottom:3px solid #00aeef;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}header small{opacity:.9}
nav{display:flex;gap:6px;padding:10px 18px 0;flex-wrap:wrap}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
main{max-width:1000px;margin:0 auto;padding:14px 18px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px;color:var(--ac)}
.row{display:grid;grid-template-columns:1.2fr 90px 2fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.lbl b{display:block}.lbl span{color:var(--mu);font-size:12px}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
textarea{min-height:54px;resize:vertical}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.bar label{font-size:12px;color:var(--mu);display:block}
.bar input{width:auto}
.btn{background:var(--ac);color:var(--on);border:0;padding:9px 16px;border-radius:7px;cursor:pointer}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:4px 10px;font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th,.t td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.t th{background:var(--bg)}.t td.r,.t th.r{text-align:right}
.wrap{overflow-x:auto}
.kpi{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi div{flex:1;min-width:150px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:20px}.kpi span{color:var(--mu);font-size:12px}
.prog{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ac)}
.tab{display:none}.tab.on{display:block}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:8px;display:none;z-index:9}
#printArea{display:none}
@media(max-width:640px){.row{grid-template-columns:1fr 80px}.row .dt{grid-column:1/-1}}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;color:#000;background:#fff;padding:0}
#printArea h1{font-size:18px;margin:0 0 10px}#printArea h3{font-size:14px;margin:14px 0 4px}
#printArea table{width:100%;border-collapse:collapse;font-size:12px}#printArea th,#printArea td{border:1px solid #444;padding:4px 6px;text-align:left;vertical-align:top;color:#000;background:#fff}
#printArea th{background:#eee}#printArea .r{text-align:right}@page{margin:12mm}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head><body>
<header><img id="logo" alt="Euro Maticc" style="height:46px"><div><h1>Daily Measures</h1><small>Daily report entry, history and monthly summary</small></div></header>
<nav><button data-t="entry" class="on">Daily Entry</button><button data-t="hist">History</button><button data-t="month">Monthly Report</button></nav>
<main>
<section class="tab on" id="entry">
 <div class="bar">
  <div><label>Report date</label><input type="date" id="date"></div>
  <button class="btn" id="save">Save</button>
  <button class="btn alt" id="pdf">Export PDF</button>
  <button class="btn alt" id="clr">Clear form</button>
 </div>
 <div class="card" id="tcard"><h2>Monthly target</h2><div id="tstat"></div><div class="bar" style="margin:8px 0 0"><div><label>Monthly target</label><input type="number" id="mt" style="width:150px"></div><div><label>Daily target (blank = monthly ÷ days in month)</label><input type="number" id="dt" style="width:150px"></div><button class="btn" id="tsave">Set target</button></div></div>
 <div id="form"></div>
</section>
<section class="tab" id="hist">
 <div class="bar">
  <div><label>From</label><input type="date" id="hf"></div>
  <div><label>To</label><input type="date" id="ht"></div>
  <button class="btn alt" id="hx">Reset</button>
  <button class="btn alt" id="bk">Backup (JSON)</button>
  <label class="btn alt" style="cursor:pointer;margin:0;color:var(--tx)">Restore<input type="file" id="rs" accept=".json" hidden></label>
 </div>
 <div class="card wrap"><table class="t" id="htab"></table></div>
</section>
<section class="tab" id="month">
 <div class="bar">
  <div><label>Month</label><input type="month" id="mo"></div>
  <div><label>Target for this month</label><input type="number" id="mmt" placeholder="not set" style="width:150px"></div><button class="btn alt" id="mtsave">Save target</button>
  <button class="btn" id="mpdf">Export Monthly PDF</button>
 </div>
 <div id="mview"></div>
</section>
</main>
<div id="toast"></div><div id="printArea"></div>

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
const ord=n=>n+(n%100>10&&n%100<14?'th':['th','st','nd','rd'][n%10]||'th');
function fd(s){const [y,m,d]=s.split('-').map(Number);return ord(d)+' '+new Date(y,m-1,1).toLocaleString('en-US',{month:'long'})+' '+y}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const lines=s=>s.split(/\n|•/).filter(x=>x.trim()).length;
const det=s=>String(s||'').split(/\n|•/).map(t=>t.trim()).filter(Boolean).map(t=>'• '+esc(t)).join('<br>');

// build form
$('form').innerHTML=SEC.map(s=>'<div class="card"><h2>'+s.t+'</h2>'+s.r.map(([id,l,tg])=>{
 const m=tg==='money';
 return '<div class="row"><div class="lbl"><b>'+l+'</b><span>'+(m?(id==='rev'?'Daily target: <i class="dtv"></i>':''):tg)+'</span></div>'+
 '<div><input type="number" min="0" id="n_'+id+'" placeholder="0"></div>'+
 '<div class="dt">'+(m?'':'<textarea id="d_'+id+'" placeholder="Details – one per line"></textarea>')+'</div></div>'}).join('')+'</div>').join('');
SEC.forEach(s=>s.r.forEach(([id,,tg])=>{const n=$('n_'+id),d=$('d_'+id);
 n.oninput=()=>n.dataset.m=1;
 if(d)d.oninput=()=>{if(!n.dataset.m)n.value=lines(d.value)||''}}));

function collect(){const r={date:$('date').value,v:{}};
 SEC.forEach(s=>s.r.forEach(([id])=>{const d=$('d_'+id);r.v[id]={n:$('n_'+id).value,d:d?d.value:''}}));return r}
function fill(r){SEC.forEach(s=>s.r.forEach(([id])=>{const x=(r&&r.v&&r.v[id])||{n:'',d:''},n=$('n_'+id),d=$('d_'+id);
 n.value=x.n;n.dataset.m=x.n!==''?1:'';if(!x.n)delete n.dataset.m;if(d)d.value=x.d}))}
function loadDate(){fill(DB[$('date').value]||null);setTargets()}
const mk=()=>$('date').value.slice(0,7);
const mname=k=>{const [y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('en-US',{month:'long'})+' '+y};
function T(k){return ST.t[k]||{m:ST.m,d:ST.d}}
function saveTarget(k,m,d){m=num(m);if(!m){toast('Enter the monthly target');return false}ST.t[k]={m,d:num(d)||Math.round(m/new Date(+k.slice(0,4),+k.slice(5,7),0).getDate())};return persist()}
function setTargets(){const k=mk(),t=ST.t[k];$('mt').value=t?t.m:'';$('dt').value=t?t.d:'';
 $('tstat').innerHTML=t?'Target for <b>'+mname(k)+'</b> is set.':'<b style="color:var(--ac)">No target set for '+mname(k)+' yet.</b> Enter the monthly target and press Set target.';
 $('tcard').style.borderColor=t?'':'var(--ac)';
 document.querySelectorAll('.dtv').forEach(e=>e.textContent=t?fm(t.d):'not set')}
$('tsave').onclick=()=>{if(saveTarget(mk(),$('mt').value,$('dt').value)){setTargets();toast('Target saved for '+mname(mk()))}};
$('mtsave').onclick=()=>{const m=$('mo').value;if(saveTarget(m,$('mmt').value,'')){renderMonth();setTargets();toast('Target saved for '+mname(m))}};
$('date').onchange=loadDate;
$('save').onclick=()=>{const r=collect();if(!r.date)return toast('Pick a date');DB[r.date]=r;if(persist())toast('Saved '+fd(r.date));renderHist()};
$('clr').onclick=()=>{if(confirm('Clear the form for this date?'))fill(null)};
$('pdf').onclick=()=>{const r=collect();if(!r.date)return toast('Pick a date');DB[r.date]=r;persist();renderHist();doPrint(dailyHTML(r))};

function dailyHTML(r){
 const g=id=>(r.v[id]||{n:'',d:''});
 let h='<h1>Euro Maticc - Daily Measures - '+fd(r.date)+'</h1>';
 SEC.forEach(s=>{h+='<h3>'+s.t+'</h3><table><tr><th>Metric</th><th class="r" style="width:80px">Actual</th><th style="width:110px">Target</th><th>Details</th></tr>';
  s.r.forEach(([id,l,tg])=>{const x=g(id),m=tg==='money';
   h+='<tr><td>'+l+'</td><td class="r">'+(m?fm(x.n):esc(x.n))+'</td><td>'+(id==='rev'?fm(T(r.date.slice(0,7)).d):m?'':tg)+'</td><td>'+(m?'':det(x.d))+'</td></tr>'});
  h+='</table>'});return h}
async function doPrint(h){
 const J=window.jspdf;let dl=null;
 try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
 if(!J||!dl){$('printArea').innerHTML=h;setTimeout(()=>window.print(),50);return}
 const wrap=document.createElement('div');wrap.innerHTML=h;
 wrap.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
 const tb=wrap.querySelector('table'),land=tb&&tb.rows[0].cells.length>8;
 const doc=new J.jsPDF({orientation:land?'l':'p',unit:'pt',format:'a4'});
 const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();let y=40;
 for(const el of wrap.children){
  if(el.tagName==='H1'){doc.setFillColor(0,0,0);doc.rect(0,0,W,64,'F');doc.setFillColor(0,174,239);doc.rect(0,64,W,3,'F');doc.addImage(LOGO,'PNG',28,11,150,41);doc.setTextColor(255,255,255);doc.setFontSize(13);doc.setFont(undefined,'bold');doc.text(doc.splitTextToSize(el.textContent,W-215),200,30);doc.setTextColor(20);y=90}
  else if(el.tagName==='H3'){if(y>H-100){doc.addPage();y=40}doc.setFontSize(11);doc.setFont(undefined,'bold');doc.setTextColor(0,120,180);doc.text(el.textContent,40,y+8);doc.setTextColor(20);y+=14}
  else if(el.tagName==='P'){doc.setFontSize(10);doc.setFont(undefined,'normal');const t=doc.splitTextToSize(el.textContent.replace(/\s+/g,' '),W-80);doc.text(t,40,y+6);y+=t.length*13+10}
  else if(el.tagName==='TABLE'){const R=[...el.rows],cs=land?{}:{0:{cellWidth:150},1:{cellWidth:50,halign:'right'},2:{cellWidth:80}};
   doc.autoTable({head:[[...R[0].cells].map(c=>c.textContent)],body:R.slice(1).map(r=>[...r.cells].map(c=>({content:c.textContent,styles:{halign:c.classList.contains('r')?'right':'left',fontStyle:c.tagName==='TH'?'bold':'normal'}}))),columnStyles:cs,startY:y,margin:{left:40,right:40},theme:'grid',useCss:false,styles:{fontSize:land?7.5:9,cellPadding:3,textColor:20,lineColor:90,lineWidth:.4},headStyles:{fillColor:[0,0,0],textColor:[255,255,255]},alternateRowStyles:{fillColor:[234,247,254]}});y=doc.lastAutoTable.finalY+10}
 }
 const name=(wrap.querySelector('h1')?wrap.querySelector('h1').textContent:'report').replace(/[^\w\- ]+/g,'').trim()+'.pdf';
 try{await dl.save({filename:name,data:doc.output('blob')});toast('PDF saved')}
 catch(e){toast(e&&e.code==='declined'?'Download cancelled':'Could not save PDF')}
}

// history
function renderHist(){const f=$('hf').value,t=$('ht').value;
 const ks=Object.keys(DB).sort().reverse().filter(k=>(!f||k>=f)&&(!t||k<=t));
 $('htab').innerHTML='<tr><th>Date</th><th class="r">Revenue</th><th class="r">Collection</th><th class="r">Veh In</th><th class="r">Quotes Sent</th><th>Actions</th></tr>'+
 (ks.length?ks.map(k=>{const v=DB[k].v;return '<tr><td>'+fd(k)+'</td><td class="r">'+fm(v.rev.n)+'</td><td class="r">'+fm(v.col.n)+'</td><td class="r">'+fm(v.vin.n)+'</td><td class="r">'+fm(v.qsent.n)+'</td><td><button class="btn sm" data-a="o" data-k="'+k+'">Open</button> <button class="btn sm alt" data-a="p" data-k="'+k+'">PDF</button> <button class="btn sm alt" data-a="x" data-k="'+k+'">Delete</button></td></tr>'}).join(''):'<tr><td colspan="6">No saved reports in this range.</td></tr>')}
$('htab').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
 if(b.dataset.a==='o'){$('date').value=k;loadDate();tab('entry')}
 else if(b.dataset.a==='p')doPrint(dailyHTML(DB[k]));
 else if(confirm('Delete report for '+fd(k)+'?')){delete DB[k];persist();renderHist();renderMonth()}};
$('hf').onchange=$('ht').onchange=renderHist;
$('hx').onclick=()=>{$('hf').value=$('ht').value='';renderHist()};
$('bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='daily-measures-backup.json';a.click()};
$('rs').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{Object.assign(DB,JSON.parse(fr.result));persist();renderHist();renderMonth();toast('Restored')}catch(x){toast('Invalid file')}};fr.readAsText(f)};

// monthly
const MC=[['rev','Revenue'],['col','Collection'],['vin','Veh In'],['vout','Veh Out'],['qreq','Quotes Req'],['qsent','Quotes Sent'],['leads','Leads'],['outa','Outbound Ans'],['free','Free Insp'],['mech','Mech/Fit'],['svc','Service Appt'],['part','Part Leads'],['rep','Repair Leads']];
function mval(v,id){return id==='leads'?['wa','fb','tt','inb'].reduce((a,k)=>a+num(v[k].n),0):num(v[id].n)}
function monthData(){const m=$('mo').value;const ks=Object.keys(DB).sort().filter(k=>k.startsWith(m));
 const tot={};MC.forEach(([id])=>tot[id]=ks.reduce((a,k)=>a+mval(DB[k].v,id),0));return {m,ks,tot}}
function monthTable(d){return '<table class="t"><tr><th>Date</th>'+MC.map(c=>'<th class="r">'+c[1]+'</th>').join('')+'</tr>'+
 d.ks.map(k=>'<tr><td>'+ord(+k.slice(8))+'</td>'+MC.map(([id])=>'<td class="r">'+fm(mval(DB[k].v,id))+'</td>').join('')+'</tr>').join('')+
 '<tr><th>Total</th>'+MC.map(([id])=>'<th class="r">'+fm(d.tot[id])+'</th>').join('')+'</tr></table>'}
function renderMonth(){const d=monthData();{const t=ST.t[d.m];$('mmt').value=t?t.m:''}const p=Math.min(100,d.tot.rev/T(d.m).m*100||0);
 $('mview').innerHTML=d.ks.length?'<div class="kpi"><div><b>'+fm(d.tot.rev)+'</b><span>Revenue vs target '+fm(T(d.m).m)+'</span><div class="prog"><i style="width:'+p+'%"></i></div></div><div><b>'+p.toFixed(1)+'%</b><span>Target achieved</span></div><div><b>'+fm(Math.max(0,T(d.m).m-d.tot.rev))+'</b><span>Remaining</span></div><div><b>'+d.ks.length+'</b><span>Days reported</span></div></div><div class="card wrap">'+monthTable(d)+'</div>':'<div class="card">No saved reports for this month.</div>'}
$('mo').onchange=renderMonth;
$('mpdf').onclick=()=>{const d=monthData();if(!d.ks.length)return toast('No data for this month');
 const [y,m]=d.m.split('-').map(Number),p=(d.tot.rev/T(d.m).m*100).toFixed(1);
 doPrint('<h1>Euro Maticc - Monthly Measures - '+new Date(y,m-1,1).toLocaleString('en-US',{month:'long'})+' '+y+'</h1><p>Monthly target: <b>'+fm(T(d.m).m)+'</b> &nbsp; Revenue: <b>'+fm(d.tot.rev)+'</b> &nbsp; Achieved: <b>'+p+'%</b> &nbsp; Remaining: <b>'+fm(Math.max(0,T(d.m).m-d.tot.rev))+'</b></p>'+monthTable(d).replace('class="t"',''))};

function tab(t){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id===t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='hist')renderHist();if(t==='month')renderMonth()}
document.querySelector('nav').onclick=e=>{if(e.target.dataset.t)tab(e.target.dataset.t)};
$('date').value=today();$('mo').value=today().slice(0,7);setTargets();loadDate();
</script></body></html>
